name: Deploy Dynamic GitHub Page (Build + VUC Proof)

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Production Studio + Docs Site
        run: |
          npm run build
          mkdir -p pages_dist
          cp -r dist/* pages_dist/
          mkdir -p pages_dist/docs
          cp -r docs/* pages_dist/docs/
          npm run vuc:proof
          mkdir -p pages_dist/proof
          cp proof/vuc-latest.json pages_dist/proof/vuc-latest.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'pages_dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
