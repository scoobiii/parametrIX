name: Mandatory CI Gate (Onboard + 100% Coverage + CAD Audit + Build + VUC Proof)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24.12.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Node >= 24.12.0 and Environment Contracts
        run: |
          node --version
          node -e "const [maj,min]=process.versions.node.split('.').map(Number); if (maj < 24 || (maj === 24 && min < 12)) { console.error('Node.js >=24.12.0 is required'); process.exit(1); }"
          grep -q "data/parametrix.db" .gitignore

      - name: TypeScript Strict Check (lint)
        run: npm run lint

      - name: Unit & Kernel Tests (100% V8 Coverage Enforced)
        run: npm test -- --run --coverage --coverage.thresholds.lines=100 --coverage.thresholds.functions=100 --coverage.thresholds.branches=100 --coverage.thresholds.statements=100

      - name: CAD / IPT / STEP / LLM Briefing Audit Suite (26/26)
        run: npm run audit:cad

      - name: Production Bundle Build
        run: npm run build

      - name: Generate Formal VUC Proof (SHA-256 + Ed25519)
        run: npm run vuc:proof

      - name: Upload Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage-100
          path: coverage/

      - name: Upload Formal VUC Proof Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vuc-formal-proof
          path: proof/vuc-latest.json
